name: CoomiDev APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 功能分支或提交 ref
        required: false
        default: codex/custom-assistant-settings
      upload_apk:
        description: 上传 APK artifact
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || 'codex/custom-assistant-settings' }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.95.0'
          components: clippy,rustfmt
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"

      - name: Generate CI preview signing key
        shell: bash
        run: |
          KEYSTORE="apps/coomi-app/app/testkey_untrusted.jks"
          STORE_PASS="coomi-preview-$(openssl rand -hex 12)"
          KEY_PASS="$STORE_PASS"
          rm -f "$KEYSTORE"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -alias alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=CoomiDev CI Preview, OU=CI, O=CoomiDev, L=Preview, ST=Preview, C=CN"
          printf 'coomi.signing.storePassword=%s\ncoomi.signing.keyPassword=%s\n' "$STORE_PASS" "$KEY_PASS" > local.properties
          echo "Preview signing key generated (not for release distribution)."

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund --ignore-engines

      - name: Web type-check and tests
        working-directory: apps/web
        run: |
          npm run type-check
          npm test

      - name: Web production build
        working-directory: apps/web
        run: npm run build

      - name: Rust workspace check
        working-directory: apps/coomi-rs
        run: cargo check -p coomi-ui

      - name: Build Runtime V2 assets
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap qemu-user-static binfmt-support debian-archive-keyring
          sudo update-binfmts --enable qemu-aarch64 || true
          sudo RUNTIME_V2_OUTPUT="$PWD/runtime-v2-dist" scripts/runtime-v2/build-rootfs.sh
          RUNTIME_V2_OUTPUT="$PWD/runtime-v2-dist" scripts/runtime-v2/build-proot-host.sh

      - name: Build CoomiDev release APK
        working-directory: .
        env:
          COOMI_DEV_BUILD: '1'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleRelease

      - name: Verify APK identity and signature
        shell: bash
        run: |
          APK=$(find apps/coomi-app/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          echo "APK=$APK"
          BADGING="$ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging $APK"
          grep -q "package: name='com.coomidev.android'" <(eval "$BADGING") || exit 1
          grep -q "application-label:'CoomiDev'" <(eval "$BADGING") || exit 1
          grep -q "arm64-v8a" <(eval "$BADGING") || exit 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > coomidev-apk.sha256
          cp "$APK" coomidev.apk

      - name: Upload APK artifact
        if: inputs.upload_apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coomidev-apk
          path: |
            coomidev.apk
            coomidev-apk.sha256
          if-no-files-found: error
